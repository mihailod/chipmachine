# variants.conf -- single source of truth for per-variant product identity.
#
# Two build variants:
#   plus  -- full-featured build (includes YouTube/yt-dlp). Signed with a
#            Developer ID identity and distributed OUTSIDE the App Store
#            (GitHub releases). This is the historical "ChipMachineAS" build,
#            now named "ChipMachinePlus".
#   mas   -- Mac App Store build. No YouTube/yt-dlp (App Store guideline 2.5.2),
#            App-Sandboxed, distributed via the Mac App Store. Named
#            "ChipMachine".
#
# Consumed by BOTH:
#   * CMakeLists.txt -- reads <VARIANT>_PROGRAM_NAME via file(STRINGS) to set the
#                       compile-time PROGRAM_NAME, and defines CM_MAS for the mas
#                       variant (gates out the YouTube plugin + catalog rows).
#   * package_app.sh -- sources this file (plain shell KEY=VALUE) and selects the
#                       block for the chosen --plus/--mas variant to drive the
#                       .app artifact name, Info.plist CFBundle* fields, and
#                       signing/packaging outputs.
#
# Keys per variant (prefix = uppercased variant name):
#   *_PROGRAM_NAME  in-app title / help header / splash (compile-time #define)
#   *_DISPLAY_NAME  CFBundleName / CFBundleDisplayName (Finder/Dock/menu bar)
#   *_BUNDLE_ID     CFBundleIdentifier (PERMANENT once shipped -- do not change)
#   *_ARTIFACT      base name of the built .app and distribution artifact
#
# To rename a product later, edit ONLY the values here. Never change *_BUNDLE_ID
# of an already-shipped variant: it is the immutable App Store / Gatekeeper
# identity and changing it orphans existing users' updates.

PLUS_PROGRAM_NAME="ChipMachinePlus"
PLUS_DISPLAY_NAME="ChipMachinePlus"
PLUS_BUNDLE_ID="org.mihailod.chipmachineas"
PLUS_ARTIFACT="ChipMachinePlus"

MAS_PROGRAM_NAME="ChipMachine"
MAS_DISPLAY_NAME="ChipMachine"
MAS_BUNDLE_ID="org.mihailod.chipmachine"
MAS_ARTIFACT="ChipMachine"
