# variants.conf -- single source of truth for per-variant product identity.
#
# Two build variants:
#   plus  -- full-featured build (includes YouTube/yt-dlp). Signed with a
#            Developer ID identity and distributed OUTSIDE the App Store
#            (GitHub releases). This is the historical "ChipMachineAS" build,
#            now named "ChipMachinePlus".
#   mas   -- Mac App Store build. No YouTube/yt-dlp (App Store guideline 2.5.2),
#            App-Sandboxed, distributed via the Mac App Store. Named
#            "ChipMachine".
#
# Consumed by BOTH:
#   * CMakeLists.txt -- reads <VARIANT>_PROGRAM_NAME via file(STRINGS) to set the
#                       compile-time PROGRAM_NAME, and defines CM_MAS for the mas
#                       variant (gates out the YouTube plugin + catalog rows).
#   * package_app.sh -- sources this file (plain shell KEY=VALUE) and selects the
#                       block for the chosen --plus/--mas variant to drive the
#                       .app artifact name, Info.plist CFBundle* fields, and
#                       signing/packaging outputs.
#
# Keys per variant (prefix = uppercased variant name):
#   *_PROGRAM_NAME  in-app title / help header / splash (compile-time #define)
#   *_DISPLAY_NAME  CFBundleName / CFBundleDisplayName (Finder/Dock/menu bar)
#   *_BUNDLE_ID     CFBundleIdentifier (see the caveat below before changing)
#   *_ARTIFACT      base name of the built .app and distribution artifact
#
# To rename a product later, edit ONLY the values here.
#
# On *_BUNDLE_ID: for the mas variant this is immutable -- it is the App Store
# record's identity, and changing it makes a different product that existing
# users cannot update into. For the plus variant it is only a Gatekeeper /
# LaunchServices identity, and this build happens to key nothing else off it:
# there is no Sparkle/appcast (releases are a manual download-and-unzip from
# GitHub), no NSUserDefaults or CFPreferences anywhere in the source, and the
# cache/config paths come from Environment::setAppName() in src/main.cpp, not
# from the bundle ID. Plus is also un-sandboxed, so it has no per-bundle-ID
# container to orphan.
#
# Accordingly, PLUS_BUNDLE_ID was deliberately changed on 2026-08-03 from the
# historical "org.mihailod.chipmachineas" to match the ChipMachinePlus product
# name, after that build had already shipped. The two IDs in the wild are
# intentional, not a mistake. Cost was one-time and cosmetic: LaunchServices
# re-registers the file associations under the new umbrella UTI
# (org.mihailod.chipmachineplus.chiptune), and a user keeping the old .app
# alongside the new one has two apps claiming the same extensions until the old
# one is deleted. Re-check the list above before changing it again -- the
# reasoning holds only as long as none of those mechanisms are adopted.

PLUS_PROGRAM_NAME="ChipMachinePlus"
PLUS_DISPLAY_NAME="ChipMachinePlus"
PLUS_BUNDLE_ID="org.mihailod.chipmachineplus"
PLUS_ARTIFACT="ChipMachinePlus"

MAS_PROGRAM_NAME="ChipMachine"
MAS_DISPLAY_NAME="ChipMachine"
MAS_BUNDLE_ID="org.mihailod.chipmachine"
MAS_ARTIFACT="ChipMachine"
